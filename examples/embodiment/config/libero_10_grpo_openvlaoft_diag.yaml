defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# DIAG variant of libero_10_grpo_openvlaoft.yaml.
# Purpose: 100-step health-baseline run on stock validated stack
# (OpenVLA-OFT + LIBERO-10 + GRPO). Read grad_norm / ratio_abs /
# clip_fraction / success_once at step 50-100 as reference for the
# SmolVLA + LIBERO-Spatial run diff. Switched from LIBERO-Spatial to
# LIBERO-10 because RLinf HF only publishes Openvla-oft-SFT-libero10*,
# not a spatial-specific SFT ckpt. The metric magnitudes we want to
# read are task-suite-agnostic.

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results/libero_10_grpo_openvlaoft_diag"
    project_name: rlinf
    experiment_name: "openvlaoft_libero10_diag_100steps"
    logger_backends: ["tensorboard"]

  max_epochs: 100         # DIAG: was 1000
  max_steps: 100          # DIAG: was -1
  only_eval: False
  val_check_interval: -1
  save_interval: 100      # DIAG: was 25

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl

  rollout_epoch: 16
  eval_rollout_epoch: 1
  group_size: 8

  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 16            # DIAG: was 64 (¥ cap; group_size=8 → 2 prompts)
    max_steps_per_rollout_epoch: 512
    max_episode_steps: 512
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
  eval:
    total_num_envs: 8             # DIAG: was 500 (we are not actually evaluating)
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False           # DIAG: was True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    # DIAG: matches your hf download --local-dir target
    model_path: "/root/autodl-tmp/openvla-oft-libero10"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 4096          # DIAG: was 16384 (scaled with total_num_envs 64→16)
  seed: 1234
  enable_offload: True

  model:
    model_path: "/root/autodl-tmp/openvla-oft-libero10"   # DIAG: same as rollout
    model_type: "openvla_oft"
    max_prompt_length: 128

  optim:
    lr: 2.0e-5
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
