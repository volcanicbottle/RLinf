defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/smolvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# Minimum first-run config. Goal: see `train/actor/loss` appear in the
# logger OR hit OOM on the first PPO step. Either outcome confirms the
# launch path works end-to-end (init → rollout → forward → loss →
# backward). After this is verified, scale envs/steps up and look at
# real memory use. DO NOT use this for actual training.
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results/libero_spatial_ppo_smolvla_min"
    project_name: rlinf
    experiment_name: "smolvla_libero_spatial_min"
    logger_backends: ["tensorboard", "wandb"]

  # Hard safety cap: stop after a handful of PPO steps regardless of
  # epoch progress. Prevents a runaway from burning cloud time once
  # the link is confirmed.
  max_epochs: 1
  max_steps: 5

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 2                   # MIN-CONFIG: 2 (was 1) — keep tiny but >= GRPO min
  reward_coef: 1.0
  rollout_epoch: 1                # MIN-CONFIG: 1 (was 2) — one pass per rollout buffer
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 2             # MIN-CONFIG: 2 (was 4)
    max_episode_steps: 50         # MIN-CONFIG: 50 — must >= num_action_chunks so
                                  # one chunk_step fits inside an episode
    max_steps_per_rollout_epoch: 50  # MIN-CONFIG: 50 — n_chunk_steps =
                                     # max_steps_per_rollout_epoch //
                                     # num_action_chunks, must be >= 1
  eval:
    total_num_envs: 1
    max_episode_steps: 10
    auto_reset: True
    ignore_terminations: True
    max_steps_per_rollout_epoch: 10
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  # unnorm_key: libero_spatial   # openpi 残留字段 — SmolVLA 不读
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 2            # MIN-CONFIG: 2 (= micro_batch * num_envs)
  seed: 42
  enable_offload: True

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: "bf16"             # MIN-CONFIG: bf16 to give FSDP a uniform
                                  # dtype (default null lets the VLM stay
                                  # bf16 while action_in_proj/value_head
                                  # remain fp32 — FSDP wrap crashes on the
                                  # dtype mismatch).
    num_action_chunks: 50         # MIN-CONFIG: 50 — must match SmolVLA's
                                  # baked chunk_size (lerobot config) so
                                  # bootstrap_step's zeros(B, num_action_chunks)
                                  # and env_interact_step's per-action
                                  # terminations stack without shape mismatch.
    add_value_head: True
    num_steps: 4                  # MIN-CONFIG: 4 (was 10) — denoise steps
    smolvla:
      detach_critic_input: True
      num_steps: 4                # mirror at sub-block since smolvla.yaml uses ${actor.model.num_steps}

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 5

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True       # train_expert_only=True freezes VLM but
                                # expert/value_head are trainable; FSDP's
                                # default flat-param packing rejects mixed
                                # requires_grad without this flag.
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
