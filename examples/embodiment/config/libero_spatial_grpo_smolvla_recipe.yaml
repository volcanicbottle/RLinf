defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/smolvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# SimpleVLA-recipe config: copy of libero_spatial_ppo_smolvla_min.yaml with the
# exploration/statistics knobs that BOTH reference frameworks (SimpleVLA-RL
# run_openvla_oft_rl_libero.sh and RLinf's own libero_spatial_grpo_openvlaoft)
# agree on, and the _min file leaves off:
#   1. filter_rewards: True       — dynamic sampling: groups where every rollout
#                                   succeeds/fails carry zero GRPO advantage;
#                                   filtering keeps the batch informative.
#   2. clip_ratio_high: 0.28      — DAPO-style clip-higher (both references).
#   3. kl_beta: 0.0               — both references run KL-free.
#   4. global_batch_size: 128     — 8-16 samples/update is noise; references use
#                                   512-16384. 128 = the max this env layout
#                                   yields per rollout epoch (see math below).
#   5. logprob_type: action_level — chunk_level sums 50x7=350 logp elements into
#                                   one ratio exponent (official openpi chunk_level
#                                   sums only 5x7=35 — not comparable). action_level
#                                   (7-element sums) matches the reference scale.
# Sample-count math (sync runner, all asserts must divide):
#   samples/update = total_num_envs * (max_steps_per_rollout_epoch // num_action_chunks)
#                  = 32 * (200 // 50) = 128  → global_batch_size 128, micro 1
#   (= 128 grad-accumulation steps; costs time, not memory).
#   If 32 envs OOM/CPU-thrash: drop to 16 envs + global_batch_size 64.
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results/libero_spatial_grpo_smolvla_recipe"
    project_name: rlinf
    experiment_name: "smolvla_libero_spatial_recipe"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: 100
  max_steps: 100

  only_eval: False
  val_check_interval: 50
  save_interval: 50

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8                   # RECIPE: 8 (was 16) — both references use 8;
                                  # 32 envs / 8 = 4 GRPO groups per rollout.
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: action_level      # RECIPE: see header note 5.
  entropy_type: token_level

  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0                    # RECIPE: KL-free (both references).
  entropy_bonus: 0
  clip_ratio_high: 0.28           # RECIPE: clip-higher (both references).
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True            # RECIPE: dynamic sampling (both references).
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 32            # RECIPE: 32 (was 16) — samples/update scales
                                  # linearly with envs; fallback 16 if OOM.
    group_size: ${algorithm.group_size}  # RECIPE: same-task env groups so GRPO
                                         # relative advantage is meaningful
                                         # (mirrors libero_spatial_grpo_openvlaoft).
    max_episode_steps: 200
    max_steps_per_rollout_epoch: 200
  eval:
    total_num_envs: 10
    max_episode_steps: 200
    auto_reset: True
    ignore_terminations: True
    max_steps_per_rollout_epoch: 200
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False      # Async-only knob (sync runner ignores it); keep
                                 # False — see PREV_LOGPROB_PASSTHROUGH_MODELS in
                                 # rlinf/config.py for why async would crash.
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 128          # RECIPE: = 32 envs * 4 chunk-steps, one
                                  # optimizer step per rollout epoch via 128
                                  # grad-accumulation micro-steps. Must divide
                                  # samples/update exactly (sync worker assert).
  seed: 42
  enable_offload: True

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: "fp32"             # Pure fp32 — lerobot hard-codes fp32 in the
                                  # denoise chain, so fp32 everywhere needs no
                                  # dtype band-aids. MUST be the literal "fp32",
                                  # not "float32" — see torch_dtype_from_precision
                                  # in rlinf/config.py.
    num_action_chunks: 50         # Must match SmolVLA's baked chunk_size.
    add_value_head: False
    num_steps: 4                  # denoise steps
    smolvla:
      detach_critic_input: True
      num_steps: 4
      # noise_level: 0.8          # OPTIONAL exploration bump (default 0.5) —
                                  # flow analog of SimpleVLA's temperature=1.6;
                                  # logp stays self-consistent under flow-SDE.

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True       # train_expert_only=True freezes VLM but the
                                # expert is trainable; FSDP's default flat-param
                                # packing rejects mixed requires_grad without this.
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
