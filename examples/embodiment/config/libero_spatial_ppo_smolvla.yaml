defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/smolvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    # Single-GPU collocated (RTX 5060 8GB).
    # Multi-GPU users: change to e.g. `actor,env,rollout: 0-1` for 2-GPU collocation.
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results/libero_spatial_ppo_smolvla"
    project_name: rlinf
    experiment_name: "smolvla_libero_spatial"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  # Kept identical to the openpi baseline — these are LIBERO-tuned PPO knobs.
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 2
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  # 8GB GPU budget — keep env count low.
  train:
    total_num_envs: 4
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
  eval:
    total_num_envs: 1
    max_episode_steps: 10
    auto_reset: True
    ignore_terminations: True
    max_steps_per_rollout_epoch: 10
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  # unnorm_key: libero_spatial   # openpi 残留字段 — SmolVLA 不读：反归一化由 lerobot
                                  # PolicyProcessorPipeline 在 predict_action_batch 内完成，
                                  # 统计量 baked 在 ckpt 里，不通过字符串 key 查表。
  enable_offload: True         # 8GB GPU — offload rollout weights to CPU
  pipeline_stage_num: 1

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1          # 8GB GPU — minimum micro batch
  global_batch_size: 4         # = micro_batch * num_envs
  seed: 42
  enable_offload: True         # 8GB GPU — offload actor weights to CPU

  # Override the default values in model/smolvla
  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    num_action_chunks: 5       # interface for the env (LIBERO uses ~5 action chunks)
    add_value_head: True
    # SmolVLA-specific overrides
    smolvla:
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 5

  # 8GB GPU — full FSDP shard + gradient checkpointing
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
