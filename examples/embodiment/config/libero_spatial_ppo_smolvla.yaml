defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/smolvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# Real-training config for SmolVLA x π_RL on LIBERO-Spatial.
# Defaults are sized for a 100-step "mini" training run on A800-80G
# (~50-90 min, ~¥7). To continue past the mini phase, override:
#   runner.resume_dir=<path-to-checkpoints/global_step_100>
#   runner.max_steps=-1
# at the command line.
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results/libero_spatial_ppo_smolvla"
    project_name: rlinf
    experiment_name: "smolvla_libero_spatial"
    logger_backends: ["tensorboard", "wandb"]

  max_epochs: -1                 # uncapped; runner stops at max_steps
  max_steps: 100                 # MINI phase. Override to -1 for full training.

  only_eval: False
  val_check_interval: 50         # eval every 50 PPO steps
  save_interval: 25              # checkpoint every 25 PPO steps → 4 saves in
                                 # the mini phase. Cheap insurance vs crashes.

algorithm:
  # PPO knobs kept identical to openpi baseline — LIBERO-tuned.
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8                  # MINI: 8 (was 2 in min). Aligns with envs and
                                 # gives advantage estimate enough samples.
  reward_coef: 1.0
  rollout_epoch: 2               # MINI: 2 passes per rollout buffer.
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 8            # MINI: 8 (min was 2). 4x more parallel data.
    max_episode_steps: 300       # LIBERO's real horizon. min config used 50
                                 # which is too short for any meaningful
                                 # success_once signal.
    max_steps_per_rollout_epoch: 50  # = num_action_chunks. n_chunk_steps = 1
                                     # chunk per epoch is fine; we get more
                                     # PPO steps via max_epochs/max_steps.
  eval:
    total_num_envs: 4            # MINI eval: 4 envs.
    max_episode_steps: 300       # full LIBERO horizon for eval too.
    auto_reset: True
    ignore_terminations: True
    max_steps_per_rollout_epoch: 300
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False           # set True if you want eval videos saved
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False      # Async-only knob (the sync EmbodiedRunner
                                 # ignores it). KEEP False: the async proximal
                                 # path cannot handle step-axis prev_logprobs —
                                 # see PREV_LOGPROB_PASSTHROUGH_MODELS in
                                 # rlinf/config.py. Ratio-leg consistency is
                                 # handled in default_forward instead.
  # unnorm_key: libero_spatial   # openpi 残留字段 — SmolVLA 不读
  enable_offload: True           # cheap insurance — rollout weights offloaded
                                 # to CPU between calls. A800-80G doesn't need
                                 # it but leaving on doesn't hurt.
  pipeline_stage_num: 1

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8            # = micro_batch_size * total_num_envs.
  seed: 42
  enable_offload: True

  model:
    model_path: "HuggingFaceVLA/smolvla_libero"
    precision: "fp32"             # Pure fp32 — lerobot hard-codes fp32 in the
                                  # denoise chain, so fp32 everywhere needs no
                                  # dtype band-aids (~1.5-2x slower than bf16;
                                  # mixed precision is a later optimization).
                                  # MUST be the literal "fp32", not "float32" —
                                  # see torch_dtype_from_precision in rlinf/config.py.
    num_action_chunks: 50         # Must match SmolVLA's baked chunk_size=50.
    add_value_head: True
    num_steps: 4                  # denoise steps (min config was 4 for speed;
                                  # full SmolVLA default is 10. Keep 4 for
                                  # mini, bump later if loss plateaus.)
    smolvla:
      detach_critic_input: True
      num_steps: 4

  optim:
    lr: 5.0e-6                    # conservative VLA RL lr
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 5

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True       # train_expert_only freezes VLM → mixed
                                # requires_grad → need this flag
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
